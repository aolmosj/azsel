name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # azsel is published for linux and darwin (see .goreleaser.yaml).
        # Shell detection and the configuration paths differ between both, so
        # it is worth exercising the two of them.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The wrapper is installed into both bash and zsh, and the shell tests
      # skip whichever interpreter is missing. Without this, coverage would
      # depend on what the runner image happens to ship and a silent skip
      # would pass for a green run.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Shells under test
        run: |
          bash --version | head -1
          zsh --version

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race ./...

  integration:
    name: Integration (real az)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # GitHub's Linux runners ship the Azure CLI. Assert it rather than
      # assume it, so a runner image that drops az turns this job red instead
      # of skipping the tests silently.
      - name: Assert az is present
        run: az version --output none

      - name: Integration tests
        run: AZSEL_INTEGRATION=1 go test -run TestIntegration ./internal/config/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted:"
            echo "$unformatted"
            echo
            gofmt -d .
            exit 1
          fi
