name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # azsel se publica para linux y darwin (ver .goreleaser.yaml). La
        # detección de shell y las rutas de configuración difieren entre
        # ambos, así que conviene ejercitar los dos.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The wrapper is installed into both bash and zsh, and the shell tests
      # skip whichever interpreter is missing. Without this, coverage would
      # depend on what the runner image happens to ship and a silent skip
      # would pass for a green run.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Shells under test
        run: |
          bash --version | head -1
          zsh --version

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race ./...

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Estos ficheros no están formateados:"
            echo "$unformatted"
            echo
            gofmt -d .
            exit 1
          fi
